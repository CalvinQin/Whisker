name: Whisker
options:
  bundleIdPrefix: com.haoqi.whisker
  deploymentTarget:
    macOS: "15.0"
targets:
  Whisker:
    type: application
    platform: macOS
    sources:
      - Whisker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haoqi.whisker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # To be filled by user in Xcode
    info:
      path: Whisker/Info.plist
      properties:
        LSUIElement: true # Menu bar app
        NSHumanReadableCopyright: "Copyright © 2026 Atlas. All rights reserved."
