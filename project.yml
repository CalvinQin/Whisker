name: Whisker
options:
  bundleIdPrefix: com.haoqi.whisker
  deploymentTarget:
    macOS: "15.0"
targets:
  Whisker:
    type: application
    platform: macOS
    sources:
      - path: Whisker
        excludes:
          - KeyboardRecorder.swift
          - Localizable.xcstrings
          - OnboardingView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haoqi.whisker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # To be filled by user in Xcode
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    info:
      path: Whisker/Info.plist
      properties:
        LSUIElement: false # The user can hide the Dock icon at runtime.
        NSHumanReadableCopyright: "Copyright © 2026 Atlas. All rights reserved."
